[package]
name = "auth-crypto"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
auth-core.workspace = true
async-trait.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
argon2.workspace = true
# нужен crypto-backend (rust_crypto или aws_lc_rs) — см. `cargo info jsonwebtoken`
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
# для EdDSA: генерация ключей и PKCS8-обёртка приватного ключа под jsonwebtoken::EncodingKey
ed25519-dalek.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
