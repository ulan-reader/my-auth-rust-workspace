[package]
name = "admin-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8.21", features = ["csr"] }
leptos_router = "0.8.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.7"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["Storage", "Window"] }
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = "s"
