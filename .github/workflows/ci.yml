name: CI

on:
  push:
    branches: [main]
  pull_request:

# минимальные права токена: CI только читает репозиторий
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # та же версия, что в Dockerfile (ARG RUST_VERSION)
  RUST_VERSION: "1.98"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      # интеграционные тесты auth-postgres поднимают Postgres через testcontainers —
      # Docker на ubuntu-раннере уже есть
      - run: cargo test --workspace --locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # известные уязвимости (RustSec) в зависимостях из Cargo.lock
      - run: cargo audit --deny warnings

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      # только сборка прод-образа, без публикации; слой зависимостей кешируется между запусками
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: auth-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-тест образа
        run: docker run --rm auth-server:ci jwt-keygen
